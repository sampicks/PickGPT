<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PickGPT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#cfe6ff; --paper:#ffffff; --ink:#111; --sun:#ffd43b; --pink:#ff9ad5; --mint:#8ff0c0; --lilac:#c9b8ff;
  --font:"Space Grotesk","Trebuchet MS",system-ui,sans-serif;
  --b:2.5px solid var(--ink); --hard:4px 4px 0 var(--ink);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font);background:var(--sky);color:var(--ink);display:flex;flex-direction:column;overflow:hidden;
  background-image:radial-gradient(rgba(17,17,17,.14) 1.2px,transparent 1.2px);background-size:22px 22px}
button,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* header */
.topbar{display:flex;align-items:center;gap:10px;padding:14px 20px;flex-wrap:wrap}
.brand{background:var(--sun);border:var(--b);box-shadow:var(--hard);padding:6px 14px;font-weight:700;font-size:22px;letter-spacing:-.03em;transform:rotate(-2deg)}
.sub{font-weight:500;font-size:15px;margin-left:6px}
.grow{flex:1}
.chip,.btn{border:var(--b);background:var(--paper);padding:8px 14px;font-weight:700;font-size:14px;border-radius:999px;box-shadow:3px 3px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.pink{background:var(--pink)}
.chip{font-weight:500;background:var(--mint)}
.chip.busy{background:var(--sun)}

/* chat */
.chat-container{flex:1;overflow-y:auto;padding:10px 20px 20px}
.col{max-width:800px;margin:0 auto}
.welcome{margin:4vh auto 0;max-width:800px}
.welcome h1{font-size:clamp(44px,9vw,92px);line-height:.92;letter-spacing:-.05em;margin:0 0 16px;font-weight:700}
.welcome p{font-size:18px;max-width:520px;margin:0;line-height:1.5}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;max-width:800px;margin:30px auto 0}
.card{border:var(--b);box-shadow:var(--hard);padding:18px;text-align:left;font-size:18px;font-weight:700;line-height:1.2;min-height:104px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .1s,box-shadow .1s}
.card span{font-size:28px}
.card:nth-child(1){background:var(--mint)}.card:nth-child(2){background:var(--lilac)}
.card:nth-child(3){background:var(--pink)}.card:nth-child(4){background:var(--sun)}
.card:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}

.message{max-width:800px;margin:0 auto 22px;display:flex;flex-direction:column}
.message.user{align-items:flex-end}
.who{font-size:13px;font-weight:700;margin:0 6px 5px}
.message-content{border:var(--b);box-shadow:var(--hard);padding:13px 18px;font-size:16.5px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;max-width:min(88%,680px);min-height:50px}
.message.user .message-content{background:var(--sun);border-radius:22px 22px 4px 22px}
.message.assistant .message-content{background:var(--paper);border-radius:22px 22px 22px 4px;max-width:100%}
.message.assistant .message-content:empty::after{content:"●●●";letter-spacing:4px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}

.tool-progress{max-width:800px;margin:-8px auto 16px}
.tool-progress-box{display:inline-flex;align-items:center;gap:9px;background:var(--lilac);border:var(--b);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700}
.tool-spinner{width:13px;height:13px;border:3px solid var(--ink);border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
.tool-check{font-weight:700}
@keyframes spin{to{transform:rotate(360deg)}}

/* composer */
.composer{padding:6px 20px 16px}
.input-wrapper{max-width:800px;margin:0 auto;background:var(--paper);border:var(--b);box-shadow:6px 6px 0 var(--ink);border-radius:20px;padding:12px 14px}
textarea{display:block;width:100%;border:0;outline:0;resize:none;background:transparent;font-size:17px;line-height:1.5;min-height:30px;max-height:170px;padding:2px 0 8px}
textarea::placeholder{color:#666}
.tools{display:flex;align-items:center;gap:8px}
.icon-btn{width:40px;height:40px;border:var(--b);border-radius:12px;background:var(--paper);font-size:17px;display:grid;place-items:center}
.icon-btn:hover{background:var(--mint)}
.model-select{height:40px;max-width:180px;border:var(--b);border-radius:12px;background:var(--lilac);padding:0 10px;font-size:13px;font-weight:700}
.mic-btn.recording{background:#ff5a4e;animation:blink 1s infinite}
.send-btn{height:40px;padding:0 20px;border:var(--b);border-radius:12px;background:var(--ink);color:#fff;font-weight:700;font-size:15px}
.send-btn:hover{background:#333}
.send-btn:disabled{background:#999;cursor:not-allowed}
.notice{max-width:800px;margin:10px auto 0;font-size:12px;text-align:center;font-weight:500}

/* chats drawer (right) */
.drawer{position:fixed;top:0;right:0;bottom:0;width:320px;max-width:88vw;background:var(--paper);border-left:var(--b);z-index:20;padding:18px;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .22s}
body.drawer-open .drawer{transform:none}
.drawer-head{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:22px;margin-bottom:14px;letter-spacing:-.02em}
#conversationList{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:2px 4px 8px 2px}
.history-item{border:var(--b);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--paper)}
.history-item:hover{background:var(--mint)}
.history-item.active{background:var(--sun);font-weight:700;box-shadow:3px 3px 0 var(--ink)}
.scrim{display:none;position:fixed;inset:0;background:rgba(17,17,17,.4);z-index:10}
body.drawer-open .scrim{display:block}

@media(max-width:640px){
  .cards{grid-template-columns:1fr}.sub{display:none}
  .topbar,.chat-container,.composer{padding-left:12px;padding-right:12px}
  .model-select{max-width:120px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="scrim" onclick="toggleDrawer()"></div>

<aside class="drawer">
  <div class="drawer-head">Your chats <button class="btn" onclick="toggleDrawer()" aria-label="Close">✕</button></div>
  <div id="conversationList"></div>
</aside>

<header class="topbar">
  <div class="brand">PickGPT</div>
  <span class="sub">Agentic AI Chatbot</span>
  <span class="grow"></span>
  <span class="chip" id="status">Ready</span>
  <button class="btn" onclick="toggleDrawer()">Chats</button>
  <button class="btn pink" onclick="newChat()">+ New</button>
</header>

<div class="chat-container" id="chatContainer">
  <div class="welcome" id="welcome">
    <h1>Ask it.<br>Upload it.<br>Search it.</h1>
    <p>Chat with memory, read your documents, browse the web and do the maths.</p>
  </div>
  <div class="cards" id="cards">
    <button class="card" onclick="usePrompt('Search the web for latest AI agent news.')"><span>🌐</span>Search latest web info</button>
    <button class="card" onclick="usePrompt('Summarize the document I uploaded.')"><span>📄</span>Summarize uploaded document</button>
    <button class="card" onclick="usePrompt('Type here...')"><span>🧠</span>Save something to memory</button>
    <button class="card" onclick="usePrompt('Calculate 125 * 48 / 6')"><span>🧮</span>Use calculator tool</button>
  </div>
</div>

<div class="composer">
  <div class="input-wrapper">
    <input type="file" id="fileInput" style="display:none" accept=".pdf,.docx,.txt,.md,.py,.csv" onchange="uploadFile()">
    <textarea id="messageInput" placeholder="Ask anything..." rows="1" oninput="autoResize(this)" onkeydown="handleKeyDown(event)"></textarea>
    <div class="tools">
      <button class="icon-btn" onclick="openFilePicker()" title="Upload document" aria-label="Upload document">📎</button>
      <select id="modelSelect" class="model-select" title="Select model" aria-label="Select model">
        <option value="gemini-2.5-flash">gemini-2.5-flash</option>
        <option value="gemini-2.5-pro">gemini-2.5-pro</option>
        <option value="gemini-2.5-flash-lite">gemini-2.5-flash-lite</option>
        <option value="gemini-1.5-flash">gemini-1.5-flash</option>
        <option value="gemini-1.5-pro">gemini-1.5-pro</option>
      </select>
      <span class="grow"></span>
      <button class="icon-btn mic-btn" id="micBtn" onclick="toggleDictation()" title="Dictate" aria-label="Dictate">🎙️</button>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
  </div>
  <div class="notice" id="noticeText">PickGPT can make mistakes. Check important info.</div>
</div>

<script>
const DEFAULT_NOTICE = "PickGPT can make mistakes. Check important info.";
const chatContainer = document.getElementById("chatContainer");
const messageInput = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const statusText = document.getElementById("status");
const conversationList = document.getElementById("conversationList");
const modelSelect = document.getElementById("modelSelect");
const noticeText = document.getElementById("noticeText");
const micBtn = document.getElementById("micBtn");

let threadId = localStorage.getItem("thread_id");
if (!threadId) { threadId = crypto.randomUUID(); localStorage.setItem("thread_id", threadId); }

const savedModel = localStorage.getItem("selected_model");
if (savedModel) modelSelect.value = savedModel;
modelSelect.addEventListener("change", () => {
  localStorage.setItem("selected_model", modelSelect.value);
  noticeText.textContent = `Selected model: ${modelSelect.value}`;
});

function setStatus(t, busy = false) { statusText.textContent = t; statusText.classList.toggle("busy", busy); }
function toggleDrawer() { document.body.classList.toggle("drawer-open"); }
function scrollToBottom() { chatContainer.scrollTop = chatContainer.scrollHeight; }

/* dictation */
let recognition = null, isDictating = false;

function setupSpeechRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  const rec = new SR();
  rec.lang = "en-US"; rec.continuous = true; rec.interimResults = true;
  rec.onstart = () => { isDictating = true; micBtn.classList.add("recording"); micBtn.textContent = "⏹️"; setStatus("Listening...", true); };
  rec.onresult = (e) => {
    let fin = "", interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) fin += t + " "; else interim += t;
    }
    if (fin) {
      const cur = messageInput.value.trim();
      messageInput.value = cur ? cur + " " + fin.trim() : fin.trim();
      autoResize(messageInput);
    }
    if (interim) noticeText.textContent = "Listening: " + interim;
  };
  rec.onerror = (e) => {
    console.error("Speech recognition error:", e.error);
    if (e.error === "not-allowed") alert("Microphone permission denied. Please allow microphone access.");
    stopDictation();
  };
  rec.onend = () => { if (isDictating) { try { rec.start(); } catch (err) { stopDictation(); } } };
  return rec;
}

function toggleDictation() {
  if (!recognition) recognition = setupSpeechRecognition();
  if (!recognition) { alert("Speech recognition is not supported in this browser. Please use Chrome or Edge."); return; }
  if (isDictating) stopDictation(); else { try { recognition.start(); } catch (e) { console.error(e); } }
}

function stopDictation() {
  isDictating = false;
  if (recognition) { try { recognition.stop(); } catch (e) { console.error(e); } }
  micBtn.classList.remove("recording"); micBtn.textContent = "🎙️";
  setStatus("Ready"); noticeText.textContent = DEFAULT_NOTICE; messageInput.focus();
}

/* ui helpers */
function autoResize(t) { t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; }
function hideWelcome() {
  ["welcome", "cards"].forEach(id => { const el = document.getElementById(id); if (el) el.style.display = "none"; });
}
function handleKeyDown(e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); } }
function usePrompt(text) { messageInput.value = text; autoResize(messageInput); messageInput.focus(); }
function openFilePicker() { document.getElementById("fileInput").click(); }

function addMessage(role, content = "") {
  hideWelcome();
  const div = document.createElement("div");
  div.className = role === "user" ? "message user" : "message assistant";
  const who = document.createElement("div");
  who.className = "who";
  who.textContent = role === "user" ? "You" : "PickGPT";
  const body = document.createElement("div");
  body.className = "message-content";
  body.textContent = content;
  div.appendChild(who); div.appendChild(body);
  chatContainer.appendChild(div);
  scrollToBottom();
  return body;
}

function detectLikelyTool(message) {
  const t = message.toLowerCase();
  if (/remember that|save this|store this|keep in memory|memorize/.test(t)) return "Memory Save";
  if (/what do you remember|recall|my memory|remember about me/.test(t)) return "Memory Recall";
  if (/document|pdf|file|uploaded|summarize|summary|according to|based on/.test(t)) return "Document Search";
  if (/latest|current|today|now|recent|news|search web|web search|internet|online|price|version|update|2025|2026|who is|what is happening|trending|release|new model|current ceo|latest version/.test(t)) return "Web Search";
  if (/(\d+\s*[\+\-\*\/]\s*\d+)|calculate|calculation|math|solve/.test(t)) return "Calculator";
  return null;
}

function addToolProgress(name) {
  const wrapper = document.createElement("div"); wrapper.className = "tool-progress";
  const box = document.createElement("div"); box.className = "tool-progress-box";
  const icon = document.createElement("span"); icon.className = "tool-spinner";
  const text = document.createElement("span"); text.textContent = `Using ${name}...`;
  box.appendChild(icon); box.appendChild(text); wrapper.appendChild(box);
  chatContainer.appendChild(wrapper); scrollToBottom();
  return { wrapper, icon, text };
}

function completeToolProgress(tp, name) {
  if (!tp) return;
  tp.icon.className = "tool-check"; tp.icon.textContent = "✓";
  tp.text.textContent = `${name} completed`;
}

/* conversations */
async function loadConversations() {
  try {
    const res = await fetch("/conversations");
    const data = await res.json();
    conversationList.innerHTML = "";
    if (!data.conversations || data.conversations.length === 0) {
      conversationList.innerHTML = `<div class="history-item">No chats yet</div>`;
      return;
    }
    data.conversations.forEach(conv => {
      const item = document.createElement("div");
      item.className = "history-item";
      if (conv.thread_id === threadId) item.classList.add("active");
      item.textContent = conv.title || "New Chat";
      item.onclick = () => loadConversation(conv.thread_id);
      conversationList.appendChild(item);
    });
  } catch (e) { console.error("Failed to load conversations:", e); }
}

async function loadConversation(id) {
  threadId = id;
  localStorage.setItem("thread_id", threadId);
  document.body.classList.remove("drawer-open");
  try {
    const res = await fetch(`/history/${threadId}`);
    const data = await res.json();
    chatContainer.innerHTML = "";
    if (!data.messages || data.messages.length === 0) { renderWelcome(); await loadConversations(); return; }
    data.messages.forEach(m => addMessage(m.role === "user" ? "user" : "assistant", m.content));
    await loadConversations();
  } catch (e) { console.error("Failed to load conversation:", e); }
}

function renderWelcome() {
  chatContainer.innerHTML = `
    <div class="welcome" id="welcome">
      <h1>Ask it.<br>Upload it.<br>Search it.</h1>
      <p>Chat with memory, read your documents, browse the web and do the maths.</p>
    </div>
    <div class="cards" id="cards">
      <button class="card" onclick="usePrompt('Search the web for latest AI agent news.')"><span>🌐</span>Search latest web info</button>
      <button class="card" onclick="usePrompt('Summarize the document I uploaded.')"><span>📄</span>Summarize uploaded document</button>
      <button class="card" onclick="usePrompt('Type here...')"><span>🧠</span>Save something to memory</button>
      <button class="card" onclick="usePrompt('Calculate 125 * 48 / 6')"><span>🧮</span>Use calculator tool</button>
    </div>`;
}

/* streaming */
function parseSSEPart(part) {
  const lines = part.split(/\r?\n/).filter(l => l.trim().startsWith("data:"));
  if (!lines.length) return null;
  const json = lines.map(l => l.replace(/^data:\s*/, "")).join("\n").trim();
  if (!json || json === "[DONE]") return null;
  try { return JSON.parse(json); }
  catch (e) { console.error("Invalid stream JSON:", json, e); return null; }
}

async function sendMessage() {
  const message = messageInput.value.trim();
  if (!message) return;
  if (isDictating) stopDictation();

  const model = modelSelect.value || "gemini-2.5-flash";
  addMessage("user", message);
  messageInput.value = ""; messageInput.style.height = "auto";
  sendBtn.disabled = true;
  setStatus(`Thinking with ${model}...`, true);

  const tool = detectLikelyTool(message);
  let tp = null;
  if (tool) { tp = addToolProgress(tool); setStatus(`Using ${tool}...`, true); }

  const bot = addMessage("assistant", "");
  let gotToken = false;

  function handle(data) {
    if (!data) return;
    if (data.token !== undefined && data.token !== null) {
      if (!gotToken) {
        gotToken = true;
        if (tool && tp) completeToolProgress(tp, tool);
        setStatus(`Generating with ${model}...`, true);
      }
      bot.textContent += data.token;
      scrollToBottom();
    }
    if (data.error) {
      if (tool && tp) completeToolProgress(tp, tool);
      bot.textContent += "\n\nError: " + data.error;
      setStatus("Ready"); scrollToBottom();
    }
    if (data.done) {
      if (tool && tp && !gotToken) completeToolProgress(tp, tool);
      setStatus("Ready");
    }
  }

  try {
    const res = await fetch("/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message, thread_id: threadId, model })
    });

    if (!res.ok) {
      let err = "Request failed.";
      try { const d = await res.json(); err = d.detail || d.message || err; }
      catch (e) { console.error("Could not parse error response:", e); }
      bot.textContent = err;
      return;
    }
    if (!res.body) { bot.textContent = "Streaming is not supported by this browser."; return; }

    const reader = res.body.getReader();
    const decoder = new TextDecoder("utf-8");
    let buffer = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split(/\r?\n\r?\n/);
      buffer = parts.pop() || "";
      for (const p of parts) handle(parseSSEPart(p));
    }
    buffer += decoder.decode();
    if (buffer.trim()) handle(parseSSEPart(buffer));

  } catch (e) {
    console.error("Streaming error:", e);
    if (tool && tp) completeToolProgress(tp, tool);
    bot.textContent = "Something went wrong: " + e.message;
  } finally {
    sendBtn.disabled = false;
    setStatus("Ready");
    messageInput.focus();
    await loadConversations();
  }
}

/* upload */
async function uploadFile() {
  const input = document.getElementById("fileInput");
  if (!input.files.length) return;
  const file = input.files[0];
  addMessage("user", `📎 Uploaded document: ${file.name}`);
  const tp = addToolProgress("Document Ingestion");
  setStatus("Using Document Ingestion...", true);

  const fd = new FormData();
  fd.append("file", file);
  fd.append("thread_id", threadId);

  try {
    const res = await fetch("/upload", { method: "POST", body: fd });
    const data = await res.json();
    completeToolProgress(tp, "Document Ingestion");
    if (data.success) {
      addMessage("assistant", data.message + "\n\nYou can now ask questions about this document.");
      await loadConversations();
    } else {
      addMessage("assistant", "Upload failed: " + data.message);
    }
  } catch (e) {
    completeToolProgress(tp, "Document Ingestion");
    addMessage("assistant", "Upload failed: " + e.message);
  }
  setStatus("Ready");
  input.value = "";
}

async function newChat() {
  threadId = crypto.randomUUID();
  localStorage.setItem("thread_id", threadId);
  document.body.classList.remove("drawer-open");
  if (isDictating) stopDictation();
  renderWelcome();
  await loadConversations();
  messageInput.focus();
}

loadConversations();
if (threadId) loadConversation(threadId);
</script>
</body>
</html>
